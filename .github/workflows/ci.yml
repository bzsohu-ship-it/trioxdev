# Ez a workflow NEM publikál.
#
# Az éles oldalt a Cloudflare Pages saját Git-integrációja építi közvetlenül
# a GitHub repóból: a main ágra érkező merge után ~1-2 perccel megjelenik a
# trioxdev.pages.dev címen. A nem-main ágakról branch preview készül.
#
# Korábban itt egy wrangler-es Publish lépés is állt, de az soha nem futott le
# sikeresen (nem voltak beállítva a CLOUDFLARE_* secretek), így minden commitra
# piros X került, holott a deploy valójában megtörtént. A lépés ezért kikerült.
#
# Ha valamikor mégis innen kellene publikálni, előbb a Cloudflare oldali
# Git-integrációt kell lekapcsolni, különben dupla deploy lenne.

name: Build ellenőrzés

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build (Astro)
    permissions:
      contents: read
    steps:
      # A v4-es lépések Node.js 20-at céloztak, amit a futtatók már kényszerből
      # Node 24-en indítanak — ez ma figyelmeztetés, később hiba lesz. A v5-től
      # az action-ök natívan Node 24-en futnak.
      #
      # A node-version alább a projekt Node-verziója, nem az action-öké — a
      # kettőnek nincs köze egymáshoz, ezért marad 22 (aktív LTS).
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # A levélküldés a functions/ alatti Pages Functionben van, azt az Astro
      # build nem fordítja. A típusait a check lépés nézi át.
      - run: npm run check
